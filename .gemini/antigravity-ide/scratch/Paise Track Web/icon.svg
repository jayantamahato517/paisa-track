<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2618"/>
      <stop offset="100%" stop-color="#1F140D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#A9744F"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Inner Soft Glowing Circle -->
  <circle cx="256" cy="256" r="185" fill="#FBF6EF" filter="url(#shadow)"/>
  
  <!-- Accent Inner Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#E6DAC8" stroke-width="3"/>

  <!-- Indian Rupee Symbol (₹) + Wallet Motif Centered -->
  <g fill="url(#accentGrad)">
    <!-- Top Rupee Bar 1 -->
    <rect x="180" y="152" width="152" height="26" rx="13"/>
    
    <!-- Rupee Bar 2 (with gap for standard ₹ crossbar) -->
    <rect x="180" y="200" width="144" height="24" rx="12"/>
    
    <!-- Central Vertical Stem & Upper Arc -->
    <path d="M 232 152 
             L 232 300 
             C 278 300 316 264 316 226 
             C 316 188 286 168 252 168 
             L 252 194 
             C 272 194 288 206 288 226 
             C 288 248 266 274 232 274 
             Z"/>

    <!-- Bottom Slanted Leg -->
    <path d="M 226 270 
             L 308 360 
             L 338 360 
             L 254 266 
             Z"/>
  </g>

  <!-- Small Sparkle / Coin Indicator -->
  <circle cx="340" cy="168" r="14" fill="#D97706"/>
  <circle cx="340" cy="168" r="7" fill="#FBF6EF"/>
</svg>